name: shiora-postgres-integration

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shiora_local
      POSTGRES_USER: shiora
      POSTGRES_PASSWORD: shiora_local_password
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiora -d shiora_local']
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data
